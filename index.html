<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Puzzle</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;font-family:Arial,sans-serif}
#hud{position:fixed;left:16px;top:16px;color:#fff;background:rgba(0,0,0,.62);padding:12px 14px;border:1px solid #33404f;border-radius:10px;z-index:5;line-height:1.5}
#msg{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.75);padding:10px 16px;border-radius:8px;z-index:5;min-width:260px;text-align:center}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:1px solid #fff;border-radius:50%;z-index:4;pointer-events:none}
#mobileControls{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;touch-action:none}
#joy{position:absolute;left:22px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#stick{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#lookArea{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto;touch-action:none}
#interactBtn{position:absolute;right:25px;bottom:38px;width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(32,170,99,.72);color:#fff;font-size:18px;font-weight:bold;pointer-events:auto;touch-action:none}
#sprintBtn{position:absolute;right:115px;bottom:28px;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,180,30,.72);color:#111;font-size:13px;font-weight:bold;pointer-events:auto;touch-action:none}
@media (pointer:coarse){#mobileControls{display:block} #testMode{display:none}}
#deviceSelect{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(10,12,18,.9);padding:5px 7px;border:1px solid #596778;border-radius:8px}#deviceSelect button{padding:5px 9px;margin:0 2px;border:1px solid #66717e;border-radius:5px;background:#202832;color:#fff}#deviceSelect button.active{background:#35d879;color:#08110b}#testMode{position:fixed;right:16px;top:16px;color:#fff;background:rgba(10,12,18,.92);padding:12px;border:1px solid #596778;border-radius:10px;z-index:10;line-height:1.7;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#testMode select,#testMode button{margin:4px 2px;padding:5px 7px;border-radius:6px;border:1px solid #66717e;background:#202832;color:#fff}
#testMode button{cursor:pointer}
#testMode small{display:block;color:#b9c2cc}
</style></head><body>
<div id="hud" style="display:none"></div><div id="deviceSelect"><button id="pcMode">PC</button><button id="mobileMode">MOBILE</button></div>
<div id="testMode" style="display:none">
  <b>🧪 TEST MODE</b>
  <label>Level:
    <select id="testLevel">
      <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
      <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
    </select>
  </label>
  <button id="loadLevel">LOAD LEVEL</button>
  <button id="nextTestLevel">NEXT LEVEL</button>
  <small>T = toggle · 1–9 = level · 0 = level 10</small>
</div>
<div id="msg" style="display:none">Click the room to start</div><div id="cross">+</div>
<div id="mobileControls"><div id="joy"><div id="stick"></div></div><div id="lookArea"></div><button id="sprintBtn" type="button">SPRINT</button><button id="interactBtn" type="button" aria-hidden="true">E</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.7,5);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(1); renderer.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x303540,1.4); scene.add(hemi);
const light=new THREE.PointLight(0xffffff,1.2,30); light.position.set(0,4,1); scene.add(light);
const hud=document.getElementById("hud"), msg=document.getElementById("msg");
const testMode=document.getElementById("testMode"), testLevel=document.getElementById("testLevel");
let testModeOn=false;
const keys={}; let locked=false,yaw=0,pitch=0,level=1,carrying=false,held=null;
const mobile={x:0,y:0,sprint:false}; let playMode="auto";
let autoCooldown=0;
let level4AutoState=0;
let level1={red:null,blue:null,purple:null,plate:null,door:null,open:false};
let level2={buttons:[],sequence:[0,1,2],next:0,door:null,open:false};
let level3={boxes:[],plates:[],door:null,open:false};
let level4={mirror:null,beamA:null,beamB:null,receiver:null,door:null,open:false,state:0};
let level5={button:null,door:null,open:false,time:0,started:false};
let level6={cores:[],plates:[],door:null,open:false};
let doorAnim=null;

function mat(c){return new THREE.MeshLambertMaterial({color:c});}
function box(s,p,c){const m=new THREE.Mesh(new THREE.BoxGeometry(...s),mat(c));m.position.set(...p);scene.add(m);return m;}
function setHUD(t){hud.innerHTML=t;}
function clearPuzzle(){
  scene.children.slice().forEach(o=>{if(o.isMesh && o!==renderer.domElement) scene.remove(o);});
  // restore lights after clearing only meshes
}
function addWallHint(text,position,rotationY=0){
  const canvas=document.createElement("canvas");
  canvas.width=512; canvas.height=192;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#111820"; ctx.fillRect(0,0,512,192);
  ctx.strokeStyle="#66717e"; ctx.lineWidth=6; ctx.strokeRect(4,4,504,184);
  ctx.fillStyle="#35d879"; ctx.font="bold 30px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  const words=text.split(" "); let lines=[],line="";
  for(const word of words){
    const test=line?line+" "+word:word;
    if(ctx.measureText(test).width>440){lines.push(line);line=word;}else line=test;
  }
  if(line)lines.push(line);
  const start=96-(lines.length-1)*20;
  lines.forEach((l,i)=>ctx.fillText(l,256,start+i*40));
  const tex=new THREE.CanvasTexture(canvas);
  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(4.8,1.8),
    new THREE.MeshBasicMaterial({map:tex})
  );
  mesh.position.set(...position);
  mesh.rotation.y=rotationY;
  scene.add(mesh);
  return mesh;
}

function animateDoorOpen(door,next){
  if(!door)return;
  if(doorAnim)return;
  doorAnim={door,startY:door.position.y,endY:door.position.y+4.0,t:0,next};
  msg.textContent="DOOR OPENING...";
}
function updateDoorAnimation(dt){
  if(!doorAnim)return;
  doorAnim.t=Math.min(1,doorAnim.t+dt/0.9);
  const t=doorAnim.t;
  const eased=1-Math.pow(1-t,3);
  doorAnim.door.position.y=doorAnim.startY+(doorAnim.endY-doorAnim.startY)*eased;
  if(t>=1){
    const n=doorAnim.next;
    doorAnim=null;
    if(n) n();
  }
}

function makeRoom(){
  box([14,.2,14],[0,0,0],0x343b46);
  box([14,4.5,.2],[0,2.25,-7],0x252c36); box([14,4.5,.2],[0,2.25,7],0x252c36);
  box([.2,4.5,14],[-7,2.25,0],0x252c36); box([.2,4.5,14],[7,2.25,0],0x252c36);
}
function resetPlayer(){camera.position.set(0,1.7,5);yaw=0;pitch=0;carrying=false;held=null;}

function buildLevel1(){
  doorAnim=null;
  clearPuzzle(); makeRoom(); resetPlayer();
  box([3.2,4.3,.35],[0,2.15,-6.78],0x68717c);
  level1.door=box([2.5,3.7,.3],[0,1.85,-6.58],0xa32935);
  level1.plate=box([2.2,.12,2.2],[-3,.16,-2],0xb32632);
  level1.red=box([1.1,1.1,1.1],[-2,.75,-2],0xff2028);
  level1.blue=box([1.1,1.1,1.1],[2,.75,-2],0x168cff);
  level1.purple=null; level1.open=false;
  for(let i=-2;i<=2;i++)box([1.7,1.8,.1],[i*2.3,1.5,-6.5],0x3a4350);
  addWallHint("HINT: PUT PURPLE ON THE PLATE.",[0,2.7,-6.35],0);
  setHUD("<b>LEVEL 1 — THE FIRST LOCK</b><br>WASD: move · SHIFT: sprint · Mouse: look · E: interact<br>🔴 Red + 🔵 Blue = 🟣 Purple<br>Bring the red and blue cubes together, then put purple on the plate.");
  msg.textContent="Find the red and blue cubes.";
}

function addButtonLabel(button,text){
  const canvas=document.createElement("canvas");
  canvas.width=256; canvas.height=64;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="rgba(0,0,0,.8)"; ctx.fillRect(0,0,256,64);
  ctx.fillStyle="#ffffff"; ctx.font="bold 28px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(text,128,32);
  const tex=new THREE.CanvasTexture(canvas);
  const label=new THREE.Mesh(
    new THREE.PlaneGeometry(1.2,.3),
    new THREE.MeshBasicMaterial({map:tex,transparent:true})
  );
  label.position.set(button.position.x,button.position.y+.12,button.position.z);
  label.rotation.x=-Math.PI/2;
  scene.add(label);
  button.userData.label=label;
}

function buildLevel2(){
  doorAnim=null;
  clearPuzzle(); makeRoom(); resetPlayer();
  box([3.2,4.3,.35],[0,2.15,-6.78],0x68717c);
  level2.door=box([2.5,3.7,.3],[0,1.85,-6.58],0xa32935);
  level2.buttons=[
    box([1.4,.18,1.4],[-3,.2,-2],0xd52b36),
    box([1.4,.18,1.4],[0,.2,-2],0x287ee8),
    box([1.4,.18,1.4],[3,.2,-2],0xe0b42c)
  ];
  addButtonLabel(level2.buttons[0],"BLUE");
  addButtonLabel(level2.buttons[1],"YELLOW");
  addButtonLabel(level2.buttons[2],"RED");
  addWallHint("HINT: SEQUENCE IS RED, BLUE, YELLOW.",[0,2.7,-6.35],0);
  level2.sequence=[0,1,2]; level2.next=0; level2.open=false;
  setHUD("<b>LEVEL 2 — THE SEQUENCE</b><br>WASD: move · SHIFT: sprint · Mouse: look · E: interact<br>Press the floor buttons in the correct order:<br>🔴 RED → 🔵 BLUE → 🟡 YELLOW");
  msg.textContent="Find the first button: RED.";
}

function nextLevel(){
  if(level===1){level=2;buildLevel2();}
  else if(level===2){level=3;buildLevel3();}
  else if(level===3){level=4;buildLevel4();}
  else if(level===4){level=5;buildLevel5();}
  else if(level===5){level=6;buildLevel6();}
}

function buildLevel3(){
  doorAnim=null;
  clearPuzzle(); makeRoom(); resetPlayer();
  box([3.2,4.3,.35],[0,2.15,-6.78],0x68717c);
  level3.door=box([2.5,3.7,.3],[0,1.85,-6.58],0xa32935);
  level3.plates=[
    box([2.1,.12,2.1],[-3,.16,-2],0xb32632),
    box([2.1,.12,2.1],[3,.16,-2],0x2c9f57)
  ];
  level3.boxes=[
    box([1.2,1.2,1.2],[-3,.8,1],0xe04b42),
    box([1.2,1.2,1.2],[3,.8,1],0x4d8fe8)
  ];
  level3.boxes[0].userData.weight="heavy";
  level3.boxes[1].userData.weight="light";
  level3.open=false;
  addWallHint("HINT: USE BOTH BOXES. PUT ONE BOX ON EACH PRESSURE PLATE.",[0,2.7,-6.35],0);
  setHUD("<b>LEVEL 3 — THE WEIGHT TEST</b><br>WASD: move · SHIFT: sprint · Mouse: look · E: interact<br>🟥 Heavy box + 🟦 Light box<br>Put a box on EACH pressure plate at the same time.<br>💡 The heavy box is harder to move.");
  msg.textContent="Get both boxes onto the two pressure plates.";
}

function updateLevel3(){
  if(level!==3||level3.open)return;
  const on0=level3.boxes[0]&&level3.boxes[0].position.distanceTo(level3.plates[0].position)<1.25 ||
           level3.boxes[1]&&level3.boxes[1].position.distanceTo(level3.plates[0].position)<1.25;
  const on1=level3.boxes[0]&&level3.boxes[0].position.distanceTo(level3.plates[1].position)<1.25 ||
           level3.boxes[1]&&level3.boxes[1].position.distanceTo(level3.plates[1].position)<1.25;
  if(on0&&on1){
    level3.open=true;
    level3.plates.forEach(p=>p.material.color.set(0x35d879));
    level3.door.material.color.set(0x20aa63);
    msg.textContent="BOTH PLATES PRESSED! Go to the green door.";
  }
}

function buildLevel4(){
  doorAnim=null;
  clearPuzzle(); makeRoom(); resetPlayer();
  box([3.2,4.3,.35],[0,2.15,-6.78],0x68717c);
  level4.door=box([2.5,3.7,.3],[0,1.85,-6.58],0xa32935);
  box([1.2,2.2,.8],[-5,1.5,-4.8],0x303944);
  const emitter=box([.35,.9,.35],[-4.35,1.5,-4.8],0xff3030);
  emitter.material.emissive=new THREE.Color(0x550000);
  level4.mirror=box([.18,2.2,2.2],[0,1.5,-4.8],0x9fb8cc);
  level4.receiver=box([1.0,1.0,.35],[0,1.5,2.2],0x8b2020);
  level4.receiver.material.emissive=new THREE.Color(0x330000);
  level4.open=false; level4.state=0;
  addWallHint("HINT: THE MIRROR CHANGES THE LASER'S PATH. TURN IT UNTIL THE BEAM REACHES THE RECEIVER.",[0,2.7,-6.35],0);
  level4.beamA=box([4.0,.12,.12],[-2.15,1.5,-4.8],0xff2020);
  level4.beamB=box([.12,.12,7.0],[0,1.5,-1.3],0xff2020);
  level4.beamB.visible=false;
  setHUD("<b>LEVEL 4 — THE LASER ROOM</b><br>WASD: move · SHIFT: sprint · Mouse: look · E: interact<br>🔴 Redirect the laser into the receiver.<br>Find the mirror and press E beside it.");
  msg.textContent="The laser is hitting the wall. Find a way to redirect it.";
}

function updateLevel4(){
  if(level!==4||!level4.mirror)return;
  level4.beamB.visible=level4.state===1;
  level4.receiver.material.color.set(level4.state===1?0x35d879:0x8b2020);
  if(level4.state===1&&!level4.open){
    level4.open=true;
    level4.door.material.color.set(0x20aa63);
    msg.textContent="LASER ALIGNED! Go to the green door.";
  }
}

function buildLevel5(){
  doorAnim=null;
  clearPuzzle(); resetPlayer();
  // Level 5 is one continuous 30-unit sprint corridor. Do not call makeRoom(),
  // because makeRoom() adds the two interior end walls used by the normal rooms.
  box([14,4.5,.2],[0,2.25,-15],0x252c36); box([14,4.5,.2],[0,2.25,15],0x252c36);
  box([.2,4.5,30],[-7,2.25,0],0x252c36); box([.2,4.5,30],[7,2.25,0],0x252c36);
  box([14,.2,30],[0,0,0],0x343b46);
  level5.door=box([2.5,3.7,.3],[0,1.85,-14.58],0xa32935);
  level5.button=box([1.4,.18,1.4],[0,.2,10],0xd52b36);
  level5.open=false; level5.time=0; level5.started=false;
  addWallHint("HINT: PRESS THE RED BUTTON, THEN SPRINT ALL THE WAY TO THE DOOR.",[0,2.7,-14.7],Math.PI);
  setHUD("<b>LEVEL 5 — BEAT THE TIMER</b><br>WASD: move · SHIFT: sprint · Mouse: look · E: interact<br>🔴 Press the button, then sprint across the room to the door before time runs out!<br>⏱️ You have 6 seconds.");
  msg.textContent="Press the red button and RUN!";
}

function updateLevel5(dt){
  if(level!==5||!level5.started||level5.open)return;
  level5.time-=dt;
  if(level5.time<=0){
    level5.time=0; level5.started=false;
    level5.button.material.color.set(0xd52b36);
    msg.textContent="TIME'S UP! Press the button again.";
  }else{
    msg.textContent="⏱️ "+level5.time.toFixed(1)+" seconds!";
  }
}

function buildLevel6(){
  doorAnim=null;
  clearPuzzle(); makeRoom(); resetPlayer();
  box([3.2,4.3,.35],[0,2.15,-6.78],0x68717c);
  level6.door=box([2.5,3.7,.3],[0,1.85,-6.58],0xa32935);

  level6.plates=[
    box([2.0,.12,2.0],[-3,.16,-2],0xc737d8),
    box([2.0,.12,2.0],[3,.16,-2],0x35a8d8),
    box([2.0,.12,2.0],[0,.16,2.5],0xd8b52e)
  ];
  level6.cores=[
    box([1.0,1.0,1.0],[-3,.7,1.2],0xb83fd0),
    box([1.0,1.0,1.0],[3,.7,1.2],0x2d9fe0),
    box([1.0,1.0,1.0],[0,.7,4.5],0xe0b52e)
  ];
  level6.cores[0].userData.plate=0;
  level6.cores[1].userData.plate=1;
  level6.cores[2].userData.plate=2;
  level6.open=false;
  addWallHint("HINT: MATCH EACH CORE TO THE SAME-COLORED PLATE.",[0,2.7,-6.35],0);
  setHUD("<b>LEVEL 6 — THE THREE CORES</b><br>WASD: move · SHIFT: sprint · Mouse: look · E: interact<br>🟣 🟦 🟡 Match each core to the plate with the same color.<br>Pick up a core, carry it to its matching plate, then press E to place it.");
  msg.textContent="Match all three cores to their plates.";
}

function updateLevel6(){
  if(level!==6||level6.open)return;
  let complete=true;
  for(let i=0;i<3;i++){
    const core=level6.cores[i],plate=level6.plates[i];
    const on=core&&core.position.distanceTo(plate.position)<1.15;
    if(!on)complete=false;
    plate.material.color.set(on?[0xb83fd0,0x2d9fe0,0xe0b52e][i]:[0xc737d8,0x35a8d8,0xd8b52e][i]);
  }
  if(complete){
    level6.open=true;
    level6.door.material.color.set(0x20aa63);
    msg.textContent="ALL THREE CORES MATCH! Go to the green door.";
  }
}

function loadTestLevel(n){
  n=Number(n);
  if(n===1){level=1;buildLevel1();return;}
  if(n===2){level=2;buildLevel2();return;}
  if(n===3){level=3;buildLevel3();return;}
  if(n===4){level=4;buildLevel4();return;}
  if(n===5){level=5;buildLevel5();return;}
  if(n===6){level=6;buildLevel6();return;}
  msg.textContent="Level "+n+" is not built yet. You can still select it for future testing.";
  testLevel.value=String(n);
}

function toggleTestMode(){
  testModeOn=!testModeOn;
  testMode.style.display=testModeOn?"block":"none";
  msg.textContent=testModeOn
    ?"🧪 Test Mode ON — choose a level or press 1–9 / 0."
    :"Test Mode OFF";
  if(testModeOn) testLevel.value=String(level);
}

document.getElementById("loadLevel").addEventListener("click",()=>loadTestLevel(testLevel.value));
document.getElementById("nextTestLevel").addEventListener("click",()=>{
  const n=Math.min(10,Number(testLevel.value)+1);
  testLevel.value=String(n); loadTestLevel(n);
});

function combineLevel1(){
  if(level!==1||level1.purple||!level1.red||!level1.blue||carrying)return;
  if(level1.red.position.distanceTo(level1.blue.position)<1.25){
    const p=new THREE.Vector3().addVectors(level1.red.position,level1.blue.position).multiplyScalar(.5); p.y=.75;
    scene.remove(level1.red);scene.remove(level1.blue);
    level1.red=null;level1.blue=null;
    level1.purple=box([1.15,1.15,1.15],[p.x,p.y,p.z],0x8a2be2);
    msg.textContent="RED + BLUE = PURPLE! Pick it up and place it on the plate.";
  }
}

function interact(){
  const mobileActive=playMode==="mobile" || (playMode==="auto" && window.matchMedia("(pointer: coarse)").matches);
  if(!locked && !mobileActive)return;

  if(level===1){
    if(!carrying){
      const targets=[level1.purple,level1.red,level1.blue].filter(Boolean);
      let target=null,dist=999;
      for(const t of targets){const d=camera.position.distanceTo(t.position);if(d<dist){dist=d;target=t;}}
      if(target&&dist<2.2){held=target;carrying=true;msg.textContent=target===level1.purple?"Purple cube picked up. Take it to the plate.":"Cube picked up. Bring it next to the other cube.";return;}
    }else if(held===level1.purple&&camera.position.distanceTo(level1.plate.position)<2.5){
      carrying=false;held=null;level1.purple.position.set(level1.plate.position.x,.75,level1.plate.position.z);
      level1.open=true;level1.door.material.color.set(0x20aa63);
      msg.textContent="PURPLE CUBE ON PLATE! Go to the green door.";return;
    }else if(held){carrying=false;held=null;msg.textContent="Cube dropped.";return;}
    if(level1.open&&camera.position.distanceTo(level1.door.position)<3){animateDoorOpen(level1.door,()=>nextLevel());return;}
  }else if(level===2){
    for(let i=0;i<level2.buttons.length;i++)if(camera.position.distanceTo(level2.buttons[i].position)<2){
      if(i===level2.sequence[level2.next]){
        level2.buttons[i].material.color.set(0x35d879);level2.next++;
        if(level2.next===level2.sequence.length){level2.open=true;level2.door.material.color.set(0x20aa63);msg.textContent="SEQUENCE COMPLETE! Go to the green door.";}
        else msg.textContent="Correct! Continue the sequence.";
      }else{
        level2.next=0;level2.buttons.forEach((b,j)=>b.material.color.set([0xd52b36,0x287ee8,0xe0b42c][j]));
        msg.textContent="Wrong order! The sequence reset.";
      } return;
    }
    if(level2.open&&camera.position.distanceTo(level2.door.position)<3){animateDoorOpen(level2.door,()=>nextLevel());return;}
  }else if(level===3){
    if(!carrying){
      let target=null,dist=999;
      for(const b of level3.boxes){if(!b)continue;const d=camera.position.distanceTo(b.position);if(d<dist){dist=d;target=b;}}
      if(target&&dist<2.2){held=target;carrying=true;msg.textContent=target.userData.weight==="heavy"?"Heavy box picked up.":"Light box picked up.";return;}
    }else if(held){
      carrying=false;held=null;msg.textContent="Box dropped.";updateLevel3();return;
    }
    if(level3.open&&camera.position.distanceTo(level3.door.position)<3){animateDoorOpen(level3.door,()=>nextLevel());return;}
  }else if(level===4){
    if(level4.open&&camera.position.distanceTo(level4.door.position)<3){animateDoorOpen(level4.door,()=>nextLevel());return;}
    if(level4.mirror&&camera.position.distanceTo(level4.mirror.position)<2.4){
      level4.state=level4.state?0:1;updateLevel4();
      msg.textContent=level4.state===1?"LASER ALIGNED! Go to the green door.":"Mirror turned away.";return;
    }
  }else if(level===5){
    if(level5.button&&camera.position.distanceTo(level5.button.position)<2.2){
      if(!level5.started){level5.started=true;level5.time=6;level5.button.material.color.set(0x35d879);msg.textContent="GO! Reach the door!";}
      else{level5.started=false;level5.time=0;level5.button.material.color.set(0xd52b36);msg.textContent="Timer stopped.";}
      return;
    }
    if(level5.open&&camera.position.distanceTo(level5.door.position)<3){msg.textContent="LEVEL 5 COMPLETE!";return;}
  }else if(level===6){
    if(!carrying){
      let target=null,dist=999;
      for(const core of level6.cores){
        if(!core)continue;
        const d=camera.position.distanceTo(core.position);
        if(d<dist){dist=d;target=core;}
      }
      if(target&&dist<2.2){
        held=target;carrying=true;
        msg.textContent="Core picked up. Take it to its matching plate.";
        return;
      }
    }else if(held){
      let nearest=-1,dist=999;
      for(let i=0;i<level6.plates.length;i++){
        const d=camera.position.distanceTo(level6.plates[i].position);
        if(d<dist){dist=d;nearest=i;}
      }
      if(nearest>=0&&dist<2.4&&held.userData.plate===nearest){
        held.position.set(level6.plates[nearest].position.x,.7,level6.plates[nearest].position.z);
        carrying=false;held=null;
        updateLevel6();
        if(!level6.open)msg.textContent="Correct match! Find the next core.";
        return;
      }
      carrying=false;held=null;
      msg.textContent="Core dropped. Take it to the matching plate.";
      updateLevel6();
      return;
    }
    if(level6.open&&camera.position.distanceTo(level6.door.position)<3){
      animateDoorOpen(level6.door,()=>{msg.textContent="LEVEL 6 COMPLETE!";});
      return;
    }
  }
}

addEventListener("keydown",e=>{
  if(["KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","Space"].includes(e.code))e.preventDefault();
  if(e.code==="KeyT"){toggleTestMode();return;}
  if(testModeOn){
    const levelKey={Digit1:1,Digit2:2,Digit3:3,Digit4:4,Digit5:5,Digit6:6,Digit7:7,Digit8:8,Digit9:9,Digit0:10}[e.code];
    if(levelKey){testLevel.value=String(levelKey);loadTestLevel(levelKey);return;}
  }
  keys[e.code]=true;
  if(e.code==="KeyE")interact();
});
addEventListener("keyup",e=>{if(["KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","Space"].includes(e.code))e.preventDefault();keys[e.code]=false;});
renderer.domElement.addEventListener("click",()=>{if(!locked&&renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();});
const pcMode=document.getElementById("pcMode"),mobileMode=document.getElementById("mobileMode");
function applyPlayMode(mode){playMode=mode;const isMobile=mode==="mobile"||(mode==="auto"&&window.matchMedia("(pointer: coarse)").matches);document.getElementById("mobileControls").style.display=isMobile?"block":"none";pcMode.classList.toggle("active",!isMobile);mobileMode.classList.toggle("active",isMobile);if(isMobile&&document.pointerLockElement)document.exitPointerLock();}
pcMode.onclick=()=>applyPlayMode("pc");mobileMode.onclick=()=>applyPlayMode("mobile");applyPlayMode("auto");
const joy=document.getElementById("joy"),stick=document.getElementById("stick"),lookArea=document.getElementById("lookArea");
let joyId=null,lookId=null,lastLookX=0,lastLookY=0;
function joyMove(t){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;const max=42,d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}stick.style.transform=`translate(${dx}px,${dy}px)`;mobile.x=dx/max;mobile.y=dy/max;}
function joyEnd(){joyId=null;mobile.x=0;mobile.y=0;stick.style.transform="translate(0,0)";}
joy.addEventListener("touchstart",e=>{e.preventDefault();joyId=e.changedTouches[0].identifier;joyMove(e.changedTouches[0])},{passive:false});
joy.addEventListener("touchmove",e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId)joyMove(t)},{passive:false});
joy.addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===joyId)joyEnd()},{passive:false});
lookArea.addEventListener("touchstart",e=>{e.preventDefault();const t=e.changedTouches[0];lookId=t.identifier;lastLookX=t.clientX;lastLookY=t.clientY},{passive:false});
lookArea.addEventListener("touchmove",e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===lookId){yaw-=(t.clientX-lastLookX)*.006;pitch-=(t.clientY-lastLookY)*.006;pitch=Math.max(-1.35,Math.min(1.35,pitch));lastLookX=t.clientX;lastLookY=t.clientY;}},{passive:false});
lookArea.addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null},{passive:false});
document.getElementById("interactBtn").addEventListener("touchstart",e=>{e.preventDefault();interact()},{passive:false});
const sprintBtn=document.getElementById("sprintBtn");
sprintBtn.addEventListener("touchstart",e=>{e.preventDefault();mobile.sprint=true;sprintBtn.style.transform="scale(.92)"},{passive:false});
sprintBtn.addEventListener("touchend",e=>{e.preventDefault();mobile.sprint=false;sprintBtn.style.transform="scale(1)"},{passive:false});
document.addEventListener("pointerlockchange",()=>{locked=document.pointerLockElement===renderer.domElement;if(!locked)msg.textContent="Click the room to start";});
document.addEventListener("mousemove",e=>{if(!locked)return;yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.35,Math.min(1.35,pitch));});

const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
 camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;
 const mobileActive=playMode==="mobile" || (playMode==="auto" && window.matchMedia("(pointer: coarse)").matches);
 if(locked || mobileActive){
  const speed=((keys.ShiftLeft||keys.ShiftRight)||mobile.sprint)?6.5:2.8;
  const f=new THREE.Vector3(0,0,-1),r=new THREE.Vector3(1,0,0),rot=new THREE.Matrix4().makeRotationY(yaw);
  f.applyMatrix4(rot);r.applyMatrix4(rot);const move=new THREE.Vector3();
  if(keys.KeyW)move.add(f);if(keys.KeyS)move.sub(f);if(keys.KeyD)move.add(r);if(keys.KeyA)move.sub(r);if(mobile.y<-.15)move.add(f.clone().multiplyScalar(-mobile.y));if(mobile.y>.15)move.sub(f.clone().multiplyScalar(mobile.y));if(mobile.x>.15)move.add(r.clone().multiplyScalar(mobile.x));if(mobile.x<-.15)move.sub(r.clone().multiplyScalar(-mobile.x));
  if(move.lengthSq())move.normalize().multiplyScalar(speed*dt);
  camera.position.add(move);camera.position.x=Math.max(-6.2,Math.min(6.2,camera.position.x));camera.position.z=Math.max(-14.2,Math.min(14.2,camera.position.z));camera.position.y=1.7;
  if(carrying&&held){
    held.position.copy(camera.position);held.position.y=1.05;held.position.add(f.clone().multiplyScalar(1.5));
  }
  combineLevel1();
  updateLevel3();
  updateLevel6();
  updateLevel5(dt);
  updateDoorAnimation(dt);
 }
 renderer.render(scene,camera);
}
buildLevel1();loop();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
