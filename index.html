<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Puzzle — Prototype 01</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;font-family:Arial,sans-serif}
#hud{position:fixed;left:16px;top:16px;color:#fff;background:rgba(0,0,0,.55);padding:12px 14px;border:1px solid #33404f;border-radius:10px;z-index:5;line-height:1.5}
#msg{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.7);padding:10px 16px;border-radius:8px;z-index:5;min-width:220px;text-align:center}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:1px solid #fff;border-radius:50%;z-index:4;pointer-events:none}
button{padding:8px 12px;border:0;border-radius:7px;cursor:pointer}
</style>
</head>
<body>
<div id="hud"><b>ROOM 01 — THE FIRST LOCK</b><br>WASD: move · SHIFT: sprint · Mouse: look · E: interact<br>Red + Blue = Purple<br>Bring the red and blue cubes together, then put the purple cube on the plate.</div>
<div id="msg">Click the room to start</div><div id="cross">+</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111722);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.7, 5);

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x303540, 1.4);
scene.add(hemi);
const light = new THREE.PointLight(0xffffff, 1.2, 30);
light.position.set(0, 4, 1);
scene.add(light);

function material(color){
  return new THREE.MeshLambertMaterial({color:color});
}
function box(size, pos, color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(size[0],size[1],size[2]), material(color));
  m.position.set(pos[0],pos[1],pos[2]);
  scene.add(m);
  return m;
}

/* Room */
box([14,.2,14],[0,0,0],0x343b46);
box([14,4.5,.2],[0,2.25,-7],0x252c36);
box([14,4.5,.2],[0,2.25,7],0x252c36);
box([.2,4.5,14],[-7,2.25,0],0x252c36);
box([.2,4.5,14],[7,2.25,0],0x252c36);

/* Door */
box([3.2,4.3,.35],[0,2.15,-6.78],0x68717c);
const door = box([2.5,3.7,.3],[0,1.85,-6.58],0xa32935);

/* Puzzle objects */
const plate = box([2.2,.12,2.2],[-3,.16,-2],0xb32632);
const redCube = box([1.1,1.1,1.1],[-2,.75,-2],0xff2028);
const blueCube = box([1.1,1.1,1.1],[2,.75,-2],0x168cff);
let purpleCube = null;
let heldCube = null;
box([.8,.15,.5],[4,.2,3],0xf0b51a);
box([1.2,.15,.35],[4,.3,-4],0xffd84d);

/* Decorative panels */
for(let i=-2;i<=2;i++) box([1.7,1.8,.1],[i*2.3,1.5,-6.5],0x3a4350);

/* Simple player controls */
const keys = {};
let locked = false, yaw = 0, pitch = 0;
let carrying = false, solved = false;

addEventListener("keydown", e => {
  if(["KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if(e.code === "KeyE") interact();
});
addEventListener("keyup", e => {
  if(["KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = false;
});

renderer.domElement.addEventListener("click", () => {
  if(!locked && renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();
});
document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === renderer.domElement;
  document.getElementById("msg").textContent = locked ? "Find the blue cube." : "Click the room to start";
});
document.addEventListener("mousemove", e => {
  if(!locked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
});

function combineIfTouching(){
  if(purpleCube || !redCube || !blueCube) return;
  if(redCube.position.distanceTo(blueCube.position) < 1.25){
    scene.remove(redCube);
    scene.remove(blueCube);
    purpleCube = box([1.15,1.15,1.15],[
      (redCube.position.x+blueCube.position.x)/2,
      .75,
      (redCube.position.z+blueCube.position.z)/2
    ],0x8a2be2);
    document.getElementById("msg").textContent="RED + BLUE = PURPLE! Pick up the purple cube.";
  }
}
function interact(){
  if(!locked) return;

  if(!carrying){
    const target = purpleCube || redCube || blueCube;
    if(target && camera.position.distanceTo(target.position) < 2.2){
      heldCube=target;
      carrying=true;
      document.getElementById("msg").textContent =
        target===purpleCube ? "Purple cube picked up! Take it to the plate." :
        "Cube picked up. Bring the red and blue cubes together.";
      return;
    }
  } else if(heldCube===purpleCube && camera.position.distanceTo(plate.position) < 2.5){
    carrying=false;
    heldCube=null;
    purpleCube.position.set(plate.position.x,.75,plate.position.z);
    open=true;
    door.material.color.set(0x20aa63);
    document.getElementById("msg").textContent="PURPLE CUBE ON PLATE! DOOR UNLOCKED!";
    return;
  } else if(heldCube){
    carrying=false;
    heldCube=null;
    document.getElementById("msg").textContent="Cube dropped.";
  }

  if(open && camera.position.distanceTo(door.position)<3)
    document.getElementById("msg").textContent="ROOM COMPLETE!";
}

const clock = new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);

  const dt = Math.min(clock.getDelta(), .05);

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  if(locked){
    const sprinting = keys.ShiftLeft || keys.ShiftRight;
    const speed = sprinting ? 6.5 : 2.8;
    // Standard FPS controls: W forward, S backward, A left, D right.
    const forward = new THREE.Vector3(0,0,-1);
    const right = new THREE.Vector3(1,0,0);
    const rotation = new THREE.Matrix4().makeRotationY(yaw);
    forward.applyMatrix4(rotation);
    right.applyMatrix4(rotation);

    const move = new THREE.Vector3();
    if(keys.KeyW) move.add(forward);
    if(keys.KeyS) move.sub(forward);
    if(keys.KeyD) move.add(right);
    if(keys.KeyA) move.sub(right);

    if(move.lengthSq() > 0) move.normalize().multiplyScalar(speed * dt);

    camera.position.add(move);
    camera.position.x = Math.max(-6.2,Math.min(6.2,camera.position.x));
    camera.position.z = Math.max(-6.2,Math.min(6.2,camera.position.z));
    camera.position.y = 1.7;

    if(carrying && heldCube){
      heldCube.position.copy(camera.position);
      heldCube.position.y = 1.05;
      heldCube.position.add(forward.clone().multiplyScalar(1.5));
    }

    // If both cubes are on the floor, check whether they are touching.
    if(!carrying) combineIfTouching();
  }

  renderer.render(scene,camera);
}
loop();

addEventListener("resize",()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
